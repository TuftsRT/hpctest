# hpctest site configuration -- annotated template.
#
# Easiest start:   hpctest site init <yoursite>     (probes Slurm and the module system)
# or copy this directory to sites/<yoursite>/ and edit. See docs/PORTING.md.
# Every key is optional; the values below are the built-in defaults unless noted.

[site]
description = Example University cluster
# Regex matched against the hostname to pick this site automatically
# (otherwise set HPCTEST_SITE=<name> or pass --site).
match = ^(login|node|gpu)[0-9]
# Where run directories go. Comma-separated; the first usable entry wins.
workdir = $SCRATCH/hpctest, ~/hpctest-runs
# yes = "check", "modules" and "run --local" refuse to run outside a Slurm allocation
# (use this if your policy forbids work on login nodes).
require_allocation = no

[modules]
# Init file of the module command: Lmod ($LMOD_PKG/init/bash) or
# Environment Modules 4+ ($MODULESHOME/init/bash). Empty = auto-detect.
init =
# Command that resets the environment at the start of every job.
# Lmod: "module --force purge" also unloads sticky modules.
purge = module purge

[slurm]
# Partition for CPU tests (empty = cluster default).
partition =
# Partition for tests that declare "#@ gpus: N". Empty and no gpu_request = GPU tests SKIP.
gpu_partition = gpu
# How GPUs are requested; {gpus} becomes the count. Alternatives:
#   --gpus-per-node={gpus}      --gres=gpu:a100:{gpus}
gpu_request = --gres=gpu:{gpus}
account =
qos =
# Extra sbatch options added to every job (e.g. --reservation=maint).
extra =
# Tests marked "exclusive" on more nodes than this run shared instead (per-user CPU limits).
max_exclusive_nodes =
# Node features (sinfo -o "%N %f") that name CPU architectures. Benchmark baselines in
# baselines.conf can then differ per architecture: [stream@zen3], [stream@icelake], ...
arch_features = icelake zen3
# Node features that name GPU models; GPU benchmarks ("#@ baseline-by: gpu") keep one
# baseline per model: [gpu_bench@a100], [gpu_bench@h100], ...
gpu_features = a100 h100
# Minutes, for tests that do not set "#@ time".
default_time = 15

[aliases]
# Tests use portable, Spack-style module names. Map them to yours here.
# A value can hold several modules; an empty value loads nothing.
# Examples for an EasyBuild site:
#   gcc = GCC/12.3.0
#   openmpi = OpenMPI/4.1.5-GCC-12.3.0
#   fftw = FFTW/3.3.10-GCC-12.3.0
#   intel-oneapi-compilers = intel-compilers/2023.1.0
#   intel-oneapi-mpi = impi/2021.9.0-intel-compilers-2023.1.0
#   intel-oneapi-mkl = imkl/2023.1.0
#   python = Python/3.11.3-GCCcore-12.3.0
#   anaconda = Anaconda3
#   r = R/4.3.2-gfbf-2023a
#   blast-plus = BLAST+/2.14.1-gompi-2023a
#   quantum-espresso = QuantumESPRESSO/7.2-foss-2023a
#   nvhpc = CUDA/12.1.1

[params]
# Site values for test parameters ("hpctest show <test>" lists a test's parameters).
# Applied to every test that declares the parameter.
#   blast_db = /shared/databases/blast
#   io_dir = /scratch/hpctest-io
#   mpirun = srun --mpi=pmix

# Per-test overrides: [params:<test>]
# [params:netcdf_c]
# compiler = gcc/12.3.0 openmpi/4.1.5

[disabled]
# Tests that do not apply here; reported as SKIP.
#   mathematica_hello = no Mathematica license
#   osu_alltoall = only 4 nodes in the test partition
