# Smoke commands for "hpctest modules": module name (or name/version) = command.
# Run after the module loads; non-zero exit = FAIL. Keep them fast and non-interactive.
[smoke]
gcc = gcc --version
python = python3 -c 'import sys; print(sys.version)'
anaconda = python -c 'import numpy, scipy; print(numpy.__version__)'
r = Rscript -e 'cat(R.version.string)'
samtools = samtools --version
blast = blastn -version
openmpi = mpicc --version
cmake = cmake --version
git = git --version
