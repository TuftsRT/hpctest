# hpctest site configuration: Tufts University HPC (pax cluster)

[site]
description = Tufts University HPC (pax)
# Regex matched against the hostname to select this site automatically.
match = ^(pax|login)
workdir = /cluster/tufts/rt/shared/$USER/hpctest, ~/hpctest-runs
# Tufts policy: no Claude Code/heavy work on login nodes; module loads need an allocation.
require_allocation = yes

[modules]
init = /usr/share/lmod/lmod/init/bash
purge = module --force purge

[slurm]
partition =
gpu_partition = gpu
gpu_request = --gres=gpu:{gpus}
account =
qos =
extra =
# QOS "normal" allows 250 CPUs per user: whole-node (--exclusive) jobs above 2 nodes never start.
max_exclusive_nodes = 2
arch_features = broadwell sapphirerapids
# GPU models (node features); GPU benchmarks keep one baseline per model.
gpu_features = a100 h100 h200 l40s rtx_pro_6000
default_time = 15

[aliases]
# portable (Spack-style) name = Tufts module name
blast-plus = blast
hdf5 = hdf5/1.14.6

[params]
# node_health: shared file systems every compute node must see.
fs_paths = /cluster/tufts/apps /cluster/tufts/hpc /cluster/tufts/biocontainers
# Apptainer tests use a local image: compute nodes need not reach Docker Hub.
image = /cluster/tufts/biocontainers/base_images/openmpi_4.1.5_pmi2.sif
bind_paths = /cluster/tufts
# Open MPI 4.1.5 in this image was built for PMI-2, not PMIx.
mpi_image = /cluster/tufts/biocontainers/base_images/openmpi_4.1.5_pmi2.sif
blast_db = /cluster/tufts/biocontainers/datasets/blast/latest
blast_db_name = tsa_nt

[params:apptainer_mpi]
srun_mpi = pmi2

[params:tensorflow_cpu]
tensorflow = tensorflow/2.15.0


# netcdf-c/-fortran are installed in the gcc/12.4.0 + openmpi/4.1.7 module tree.
[params:netcdf_c]
compiler = gcc/12.4.0 openmpi/4.1.7

[params:netcdf_fortran]
compiler = gcc/12.4.0 openmpi/4.1.7

[disabled]
# test (or test:variant) = reason
